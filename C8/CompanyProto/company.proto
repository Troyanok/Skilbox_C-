syntax = "proto2";

package company;

/// @brief Модель данных предприятия.
message Company
{
   required int32 year_founded = 1;             ///< Год основания
   required string legal_address = 2;           ///< Юридический адрес
   required string name = 3;                    ///< Название компании
   optional string activity = 4;                ///< Род деятельности
   optional bool foreign_economic_activity = 5; ///< Внешнеэкономическая деятельность
}
